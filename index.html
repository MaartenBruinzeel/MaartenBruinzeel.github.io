<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="description" content="">
  <!-- <link rel="icon" href="assets/images/favicon.png"> -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header: sits on top of the hero. Logo centred, icon links on the right. -->
  <header class="site-header">
    <a class="logo slot" href="/" aria-label="Home">
      <img src="assets/icons/logo_outline_spin.gif" alt="">
    </a>
    <nav class="header-links">
      <a class="icon-link slot" href="" aria-label="">
        <img src="assets/icons/instagram4.com.jpg" alt="">
      </a>
      <a class="icon-link slot" href="" aria-label="">
        <img src="assets/icons/envelope2.gif" alt="">
      </a>
    </nav>
  </header>

  <main>

    <!-- Hero: full-width video with a tagline near the bottom. -->
    <section class="hero">
      <div class="hero-media slot">
        <video src="assets/video/hero.mp4" autoplay muted loop playsinline></video>
      </div>
      <p class="hero-tagline">Gemaakt in Rotterdam, voor meer dan alleen luisteren</p>
    </section>

    <!-- Intro: narrow text column with a small outlined button. -->
    
    <section class="intro">
      <h2 class="section-title">Jansen Audio</h2>
      <p> </p>
      <p>Ontworpen met een passie voor geluid en design, speciaal gemaakt om jou en je vrienden aan het dansen te krijgen.</p>
      <a class="button" href="">informeer nu</a>
    </section>

    <!-- Speakers: 4 portrait (3:4) pictures in a row, 2 per row on phones. -->
    <section class="speakers">
      <div class="slot"><img src="assets/images/speaker-01.jpg" alt=""></div>
      <div class="slot"><img src="assets/images/speaker-02.png" alt=""></div>
      <div class="slot"><img src="assets/images/speaker-03.jpg" alt=""></div>
      <div class="slot"><img src="assets/images/speaker-04.png" alt=""></div>
    </section>

    <h2 class="section-title">Ons verhaal</h2>

    <!-- Gallery: rows of one landscape and one portrait picture. -->
    <section class="gallery">
      <div class="slot landscape"><img src="assets/images/gallery-01.jpg" alt=""></div>
      <div class="slot"><img src="assets/images/gallery-02.jpg" alt=""></div>
      <div class="slot"><img src="assets/images/gallery-04.jpg" alt=""></div>
      <div class="slot landscape"><img src="assets/images/gallery-03.jpg" alt=""></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-insert"></div>
  </footer>

</body>
</html>
